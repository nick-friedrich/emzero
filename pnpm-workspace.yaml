packages:
  - apps/*
  - '!apps/web'

nodeLinker: hoisted

allowBuilds:
  electron: true

overrides:
  # ESLint and @electron/universal only call minimatch(); 11.0.1+ is patched.
  "minimatch@>=7 <11.0.1": ^11.0.5
  # @electron/asar (packaging) only calls the top-level glob() function, which
  # glob 14 keeps; 14.0.2+ fixes the AbortSignal advisory that 13.x has.
  "@electron/asar>glob": ^14.0.4
